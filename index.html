<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f0e8">
    <title>Dinner Randomizer</title>
    <link rel="preload" href="assets/dinner-table.jpg" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1 id="appTitle">Dinner Randomizer</h1>
        </div>
        <div class="topbar-controls">
          <div class="language-switcher" id="languageSwitcher" role="group" aria-label="Language">
            <button class="language-button" type="button" data-language="sv" aria-label="Svenska" aria-pressed="false" title="Svenska">
              <span aria-hidden="true">🇸🇪</span>
            </button>
            <button class="language-button" type="button" data-language="en" aria-label="English" aria-pressed="true" title="English">
              <span aria-hidden="true">🇬🇧</span>
            </button>
          </div>
          <span class="pool-count" id="poolCount">Loading ideas</span>
        </div>
      </header>

      <section class="planner" aria-labelledby="planner-title">
        <div class="image-strip" aria-hidden="true">
          <img id="dinnerImage" src="assets/dinner-table.jpg" alt="">
        </div>

        <article class="dinner-card" id="dinnerCard" aria-live="polite">
          <h2 id="planner-title">
            <span id="dinnerName">Loading dinner ideas...</span>
          </h2>

          <p class="description" id="dinnerDescription">The app is reading the dinner list.</p>

          <div class="ingredient-panel">
            <h3 id="ingredientHeading">Main ingredients</h3>
            <ul id="ingredientList"></ul>
          </div>

          <p class="notes" id="dinnerNotes"></p>
        </article>

        <div class="actions" id="dinnerNavigation" aria-label="Dinner navigation">
          <button class="secondary-action" id="backDinner" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            <span id="backLabel">Back</span>
          </button>
          <button class="primary-action" id="pickDinner" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M16 3h5v5"></path>
              <path d="M4 20 21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15 21 21"></path>
              <path d="M4 4l5 5"></path>
            </svg>
            <span id="pickLabel">Next dinner idea</span>
          </button>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
