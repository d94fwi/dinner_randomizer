<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f0e8">
    <meta name="apple-mobile-web-app-title" content="Dinner Randomizer">
    <meta name="application-name" content="Dinner Randomizer">
    <title>Dinner Randomizer</title>
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="assets/icons/dinner-randomizer-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1 id="appTitle">Dinner Randomizer</h1>
        </div>
        <div class="topbar-controls">
          <div class="language-switcher" id="languageSwitcher" aria-label="Language">
            <button class="language-toggle" id="languageToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="languageMenu">
              <span class="language-toggle-flag" id="languageToggleFlag" aria-hidden="true">🇬🇧</span>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </button>
            <div class="language-menu" id="languageMenu" role="menu" hidden>
              <button class="language-option" type="button" role="menuitemradio" data-language="sv" aria-checked="false">
                <span aria-hidden="true">🇸🇪</span>
                <span>Svenska</span>
              </button>
              <button class="language-option" type="button" role="menuitemradio" data-language="no" aria-checked="false">
                <span aria-hidden="true">🇳🇴</span>
                <span>Norsk</span>
              </button>
              <button class="language-option" type="button" role="menuitemradio" data-language="pl" aria-checked="false">
                <span aria-hidden="true">🇵🇱</span>
                <span>Polski</span>
              </button>
              <button class="language-option" type="button" role="menuitemradio" data-language="en" aria-checked="true">
                <span aria-hidden="true">🇬🇧</span>
                <span>English</span>
              </button>
            </div>
          </div>
          <span class="pool-count" id="poolCount">Loading ideas</span>
        </div>
      </header>

      <section class="planner" id="planner" data-status="loading" aria-labelledby="planner-title">
        <div class="image-strip" aria-hidden="true">
          <img id="dinnerImage" alt="">
        </div>

        <article class="dinner-card" id="dinnerCard" aria-live="polite">
          <h2 id="planner-title">
            <span id="dinnerName">Loading dinner ideas...</span>
          </h2>

          <p class="description" id="dinnerDescription">The app is reading the dinner list.</p>

          <div class="ingredient-panel">
            <h3 id="ingredientHeading">Main ingredients</h3>
            <ul id="ingredientList"></ul>
          </div>

          <p class="notes" id="dinnerNotes"></p>
        </article>

        <div class="actions" id="dinnerNavigation" aria-label="Dinner navigation">
          <button class="secondary-action icon-action" id="backDinner" type="button" disabled aria-label="Back" title="Back">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
          </button>
          <button class="primary-action" id="pickDinner" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M16 3h5v5"></path>
              <path d="M4 20 21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15 21 21"></path>
              <path d="M4 4l5 5"></path>
            </svg>
            <span id="pickLabel">Next dinner idea</span>
          </button>
          <button class="google-action icon-action" id="recipeSearch" type="button" disabled aria-label="Search recipe on Google" title="Search recipe on Google">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
              <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.24 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
              <path fill="#fbbc05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.24 1 12s.43 3.45 1.18 4.94l3.66-2.84z"></path>
              <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z"></path>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="app.js?v=2" defer></script>
  </body>
</html>
